global:
  domain: 127.0.0.1.nip.io
  storageClass: standard
  environment: local
  imagePullPolicy: IfNotPresent

secrets:
  existingSecret: ""
  jwtSecret: "urumi-jwt-secure-auth-secret-key-32chars"
  fernetKey: "4bKx82m_zF77Qv4GZkF3y5W9eL_P1R0s_Xa82yKm6Nw="
  mcpUpstreamToken: "dev-token-woo"
  wcConsumerKey: "ck_urumi_test_key_001"
  wcConsumerSecret: "cs_urumi_test_sec_001"

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: urumi-wordpress-pvc
  labels:
    {{- include "urumi-platform.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.global.storageClass }}
  resources:
    requests:
      storage: {{ .Values.wordpress.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: urumi-wordpress
  labels:
    {{- include "urumi-platform.labels" . | nindent 4 }}
    app: urumi-wordpress
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: urumi-wordpress
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: urumi-wordpress
  labels:
    {{- include "urumi-platform.labels" . | nindent 4 }}
    app: urumi-wordpress
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: urumi-wordpress
  template:
    metadata:
      labels:
        app: urumi-wordpress
    spec:
      containers:
        - name: wordpress
          image: {{ .Values.wordpress.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 80
              name: http
          env:
            - name: WORDPRESS_DB_HOST
              value: "urumi-mariadb:3306"
            - name: WORDPRESS_DB_NAME
              value: {{ .Values.mariadb.database | quote }}
            - name: WORDPRESS_DB_USER
              value: {{ .Values.mariadb.user | quote }}
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default "urumi-secrets" .Values.secrets.existingSecret }}
                  key: MARIADB_PASSWORD
            - name: WORDPRESS_CONFIG_EXTRA
              value: |
                define('WP_HOME', 'http://{{ .Values.ingress.hosts.store }}');
                define('WP_SITEURL', 'http://{{ .Values.ingress.hosts.store }}');
                define('FS_METHOD', 'direct');
          volumeMounts:
            - name: wordpress-data
              mountPath: /var/www/html
          resources:
            {{- toYaml .Values.wordpress.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /wp-login.php
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /wp-login.php
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
      volumes:
        - name: wordpress-data
          persistentVolumeClaim:
            claimName: urumi-wordpress-pvc

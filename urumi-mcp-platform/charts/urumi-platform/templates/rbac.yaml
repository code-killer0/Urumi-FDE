apiVersion: v1
kind: ServiceAccount
metadata:
  name: urumi-gateway-sa
  labels:
    {{- include "urumi-platform.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: urumi-tenant-provisioner-role
  labels:
    {{- include "urumi-platform.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - pods
      - pods/log
      - pods/status
      - services
      - secrets
      - configmaps
      - resourcequotas
      - limitranges
      - persistentvolumeclaims
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - networkpolicies
      - ingresses
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources:
      - jobs
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: urumi-tenant-provisioner-binding
  labels:
    {{- include "urumi-platform.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: urumi-gateway-sa
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: urumi-tenant-provisioner-role
  apiGroup: rbac.authorization.k8s.io

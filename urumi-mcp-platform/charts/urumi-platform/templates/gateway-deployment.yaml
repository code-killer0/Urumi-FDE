apiVersion: v1
kind: Service
metadata:
  name: urumi-gateway
  labels:
    {{- include "urumi-platform.labels" . | nindent 4 }}
    app: mcp-gateway
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: mcp-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: urumi-gateway
  labels:
    {{- include "urumi-platform.labels" . | nindent 4 }}
    app: mcp-gateway
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      app: mcp-gateway
  template:
    metadata:
      labels:
        app: mcp-gateway
    spec:
      serviceAccountName: urumi-gateway-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: gateway
          image: {{ .Values.gateway.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: PORT
              value: "8000"
            - name: ENVIRONMENT
              value: {{ .Values.global.environment | quote }}
            - name: K8S_IN_CLUSTER
              value: "true"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ default "urumi-secrets" .Values.secrets.existingSecret }}
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ default "urumi-secrets" .Values.secrets.existingSecret }}
                  key: JWT_SECRET
            - name: FERNET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default "urumi-secrets" .Values.secrets.existingSecret }}
                  key: FERNET_KEY
            - name: MCP_UPSTREAM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default "urumi-secrets" .Values.secrets.existingSecret }}
                  key: MCP_UPSTREAM_TOKEN
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3

apiVersion: v1
kind: Service
metadata:
  name: urumi-mariadb
  labels:
    {{- include "urumi-platform.labels" . | nindent 4 }}
    app: urumi-mariadb
spec:
  type: ClusterIP
  ports:
    - port: 3306
      targetPort: 3306
      name: mysql
  selector:
    app: urumi-mariadb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: urumi-mariadb
  labels:
    {{- include "urumi-platform.labels" . | nindent 4 }}
    app: urumi-mariadb
spec:
  serviceName: urumi-mariadb
  replicas: 1
  selector:
    matchLabels:
      app: urumi-mariadb
  template:
    metadata:
      labels:
        app: urumi-mariadb
    spec:
      containers:
        - name: mariadb
          image: {{ .Values.mariadb.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MARIADB_DATABASE
              value: {{ .Values.mariadb.database | quote }}
            - name: MARIADB_USER
              value: {{ .Values.mariadb.user | quote }}
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default "urumi-secrets" .Values.secrets.existingSecret }}
                  key: MARIADB_PASSWORD
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default "urumi-secrets" .Values.secrets.existingSecret }}
                  key: MARIADB_ROOT_PASSWORD
          volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql
          resources:
            {{- toYaml .Values.mariadb.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["sh", "-c", "mariadb-admin ping -h localhost -uroot -p$MARIADB_ROOT_PASSWORD"]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            exec:
              command: ["sh", "-c", "mariadb-admin ping -h localhost -uroot -p$MARIADB_ROOT_PASSWORD"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
  volumeClaimTemplates:
    - metadata:
        name: mariadb-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.global.storageClass }}
        resources:
          requests:
            storage: {{ .Values.mariadb.storage }}

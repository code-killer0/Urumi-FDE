apiVersion: v1
kind: Service
metadata:
  name: woo-mcp
  labels:
    app: woo-mcp
    tier: mcp-upstream
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http-mcp
  selector:
    app: woo-mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: woo-mcp
  labels:
    app: woo-mcp
    tier: mcp-upstream
spec:
  replicas: 1
  selector:
    matchLabels:
      app: woo-mcp
  template:
    metadata:
      labels:
        app: woo-mcp
        tier: mcp-upstream
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: mcp
          image: {{ .Values.woocommerceMcp.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: 8000
              name: http-mcp
          env:
            - name: PORT
              value: "8000"
            - name: WC_BASE_URL
              value: "http://wordpress"
            - name: WC_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: tenant-secrets
                  key: WC_CONSUMER_KEY
            - name: WC_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: tenant-secrets
                  key: WC_CONSUMER_SECRET
            - name: MCP_UPSTREAM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tenant-secrets
                  key: MCP_UPSTREAM_TOKEN
          resources:
            {{- toYaml .Values.woocommerceMcp.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10

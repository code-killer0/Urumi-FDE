server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to Kubernetes Gateway service
    location /api/ {
        proxy_pass http://urumi-gateway.urumi-system.svc.cluster.local:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy MCP Protocol Endpoint
    location /mcp {
        proxy_pass http://urumi-gateway.urumi-system.svc.cluster.local:8000/mcp;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Gateway Health Probe
    location /healthz {
        proxy_pass http://urumi-gateway.urumi-system.svc.cluster.local:8000/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
